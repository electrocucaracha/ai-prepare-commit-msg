[project]
name = "ai-prepare-commit"
version = "0.0.1"
description = "AI assistant that generates git commit messages"
dependencies = [
    "click",
    "litellm",
    "GitPython"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_prepare_commit_msg"]

[project.scripts]
prepare-commit = "ai_prepare_commit_msg:cli"