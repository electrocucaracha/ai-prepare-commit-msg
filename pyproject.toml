[project]
name = "ai-prepare-commit"
version = "0.0.1"
description = "AI assistant that generates git commit messages"
dependencies = [
    "click",
    "litellm",
    "GitPython"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_prepare_commit_msg"]

[project.scripts]
prepare-commit = "ai_prepare_commit_msg:cli"

[dependency-groups]
spell = [
    "pyspelling",
]
fmt = [
    "black",
    "isort",
    "pyink",
    "ruff",
]

[tool.tox]
env_list = ["3.12"]

[tool.tox.env.spell]
description = "Check spelling in the codebase"
dependency_groups = [
    "spell",
]
commands = [
    [
        "pyspelling",
        "-c",
        ".spellcheck.yml",
    ],
]

[tool.tox.env.fmt]
description = "Format the codebase"
dependency_groups = [
    "fmt",
]
commands = [
    [
        "black",
        ".",
    ],
    [
        "isort",
        ".",
    ],
    [
        "pyink",
        ".",
    ],
    [
        "ruff",
        "format",
    ],
]