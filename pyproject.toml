[project]
name = "ai-prepare-commit"
version = "0.0.1"
description = "AI assistant that generates git commit messages"
dependencies = [
    "click",
    "litellm",
    "headroom-ai",
    "GitPython>=3.1.49",
    "typesafe-sdk>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_prepare_commit_msg"]

[project.scripts]
prepare-commit = "ai_prepare_commit_msg:cli"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
test = [
    "behave",
    "pytest",
]
quality = [
    "mutmut",
    "pytest-cov",
]
fmt = [
    "black",
    "isort",
    "ruff",
]

[tool.tox]
env_list = ["3.12"]

[tool.isort]
profile = "black"

[tool.tox.env.test]
description = "Run unit tests"
dependency_groups = [
    "test",
]
commands = [
    [
        "pytest",
        "{posargs}"
    ],
]

[tool.tox.env.coverage]
description = "Run unit tests with coverage"
dependency_groups = [
    "test",
    "quality",
]
commands = [
    [
        "pytest",
        "--cov=ai_prepare_commit_msg",
        "--cov-report=term-missing",
        "{posargs}",
    ],
]

[tool.tox.env.mutation]
description = "Run mutation tests"
dependency_groups = [
    "test",
    "quality",
]
allowlist_externals = [
    "python",
]
commands = [
    [
        "mutmut",
        "run",
        "{posargs}",
    ],
]

[tool.tox.env.bdd]
description = "Run Behave BDD scenarios"
dependency_groups = [
    "test",
]
commands = [
    [
        "behave",
        "{posargs:features}",
    ],
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.mutmut]
source_paths = [ "src/ai_prepare_commit_msg" ]
pytest_add_cli_args_test_selection = [ "tests" ]
on_dependency_change = "rerun"

[tool.tox.env.fmt]
description = "Format the codebase"
dependency_groups = [
    "fmt",
]
commands = [
    [
        "black",
        ".",
    ],
    [
        "isort",
        ".",
    ],
    [
        "ruff",
        "format",
    ],
]

