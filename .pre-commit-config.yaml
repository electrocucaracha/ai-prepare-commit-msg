default_install_hook_types:
  - pre-commit
  - prepare-commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^.*\.(bin|exe|jpg|png|gif|md)$'
      - id: check-yaml
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort
        name: isort (python)
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.6"
    hooks:
      - id: ruff
        args: [--fix]
        files: ^src/
        types: [python]
      - id: ruff-format
        files: ^src/
        types: [python]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        files: \.(md|mdown|markdown)$
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [markdown]
  - repo: local
    hooks:
      - id: ai-prepare-commit
        name: generate commit message with AI
        entry: uv run prepare-commit --log-level DEBUG
        verbose: true
        log_file: /tmp/prepare-commit.log
        language: system
        stages:
          - prepare-commit-msg
