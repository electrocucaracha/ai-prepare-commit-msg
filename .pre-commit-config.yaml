default_install_hook_types:
  - pre-commit
  - prepare-commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^.*\.(bin|exe|jpg|png|gif|md)$'
      - id: check-yaml
  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: isort (python)
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.9"
    hooks:
      - id: ruff
        args: [--fix]
        files: ^src/
        types: [python]
      - id: ruff-format
        files: ^src/
        types: [python]
  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.15.0
    hooks:
      - id: markdownlint
        # MD013: line length
        args: ["-r", "~MD013"]
        files: \.(md|mdown|markdown)$
  - repo: local
    hooks:
      - id: ai-prepare-commit
        name: generate commit message with AI
        entry: prepare-commit --log-level DEBUG
        verbose: true
        log_file: /tmp/prepare-commit.log
        language: python
        stages:
          - prepare-commit-msg
