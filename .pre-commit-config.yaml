default_install_hook_types:
  - pre-commit
  - prepare-commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^.*\.(bin|exe|jpg|png|gif|md)$'
      - id: check-yaml
  - repo: https://github.com/google/yamlfmt
    rev: v0.17.2
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      - id: ai-prepare-commit-msg
        name: generate commit message with AI
        description: Generate commit message using AI system prompt.
        entry: prepare-commit --verbose
        verbose: true
        log_file: /tmp/prepare-commit.log
        language: python
        stages:
          - prepare-commit-msg
