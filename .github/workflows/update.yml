name: "Maintenance: Scheduled Dependency Version Updates"
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:
permissions: read-all
concurrency:
  group: scheduled-version-updates
  cancel-in-progress: true
jobs:
  check-versions:
    name: Update Managed Version Files
    permissions:
      contents: write
      pull-requests: write
    uses: electrocucaracha/gh-workflows/.github/workflows/update.yml@eae4abffd771a6f0844908dac04792c4fa83d2a8 # v7.0.5
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
  check-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: update Dockerfile
        # yamllint disable-line rule:line-length
        uses: ludeeus/dockerfile-updater@eaf8ea79220d076eb46c127fa9895e3de3e0a512 # 21.01.0
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
          pr_title: "chore: update Dockerfile"
