name: Bug report
description: Report something that does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Never paste API keys or other secrets in this form.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Stage a change with `git add`
        2. Run `git commit`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA of ai-prepare-commit-msg.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and provider
      description: Value of `--model` or `LITELLM_PROXY_MODEL`, for example `ollama/llama3.2`.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Dev Container
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `prepare-commit --log-level DEBUG` or `/tmp/prepare-commit.log`, with secrets removed.
      render: shell
