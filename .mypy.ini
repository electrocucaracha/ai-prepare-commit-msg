[mypy]

# Super-Linter runs mypy without installing project dependencies.
[mypy-click.*,git.*,headroom.*,litellm.*,pytest.*]
ignore_missing_imports = True

# PyYAML ships without a bundled py.typed marker in some environments;
# ignore missing stubs instead of scattering inline "type: ignore" comments.
[mypy-yaml.*]
ignore_missing_imports = True
